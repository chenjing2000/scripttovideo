name: M6.16 verification
on:
  pull_request:
  push:
    branches:
      - feature/m616-script-to-video-breaking
      - feature/m6-22-revised-data
jobs:
  node-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run verify
  windows-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npm run build
      - run: dotnet run --project tests/dotnet-revise-storage/ReviseStorage.Tests.csproj -c Release
      - run: dotnet publish desktop/ScriptToVideo.csproj -c Release -o dist/wpf
